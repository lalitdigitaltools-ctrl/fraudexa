<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050807">

<title>Fraudexa — Secure Login</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, Helvetica, sans-serif;
}

:root {
  --green: #00ff75;
  --bg: #050807;
  --muted: #a5b1a9;
}

body {
  min-height: 100vh;
  background:
    radial-gradient(circle at 15% 15%, #103c24 0%, transparent 35%),
    radial-gradient(circle at 85% 85%, #06301e 0%, transparent 35%),
    var(--bg);

  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 22px;
  overflow-x: hidden;
}

/* Background Animation */

.orb {
  position: fixed;
  width: 280px;
  height: 280px;
  border-radius: 50%;
  background: rgba(0,255,117,.07);
  filter: blur(65px);
  animation: float 8s ease-in-out infinite alternate;
  pointer-events: none;
}

.orb.one {
  top: 5%;
  left: -100px;
}

.orb.two {
  bottom: 0;
  right: -100px;
  animation-delay: 2s;
}

@keyframes float {
  from {
    transform: translateY(-25px);
  }
  to {
    transform: translateY(35px);
  }
}

/* Login Card */

.login-card {
  position: relative;
  width: 100%;
  max-width: 450px;
  padding: 42px 32px;

  background: rgba(12, 19, 15, .92);
  border: 1px solid rgba(0,255,117,.25);
  border-radius: 25px;

  box-shadow:
    0 0 50px rgba(0,255,117,.08),
    0 25px 80px rgba(0,0,0,.55);

  backdrop-filter: blur(18px);

  animation: appear .8s ease both;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(30px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Logo */

.logo {
  text-align: center;
  font-size: 34px;
  font-weight: 900;
  letter-spacing: 2px;
  color: var(--green);
  text-shadow: 0 0 22px rgba(0,255,117,.35);
  margin-bottom: 25px;
}

.logo span {
  color: white;
}

/* Heading */

.icon {
  width: 65px;
  height: 65px;
  margin: 0 auto 18px;
  border-radius: 20px;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 29px;

  background: rgba(0,255,117,.09);
  border: 1px solid rgba(0,255,117,.25);

  box-shadow: 0 0 25px rgba(0,255,117,.08);
}

h1 {
  text-align: center;
  font-size: 29px;
  margin-bottom: 10px;
}

.subtitle {
  text-align: center;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.6;
  margin-bottom: 32px;
}

/* Form */

.form-group {
  margin-bottom: 21px;
}

label {
  display: block;
  margin-bottom: 9px;
  font-size: 14px;
  font-weight: 700;
  color: #dce7df;
}

.input-wrap {
  position: relative;
}

.input {
  width: 100%;
  height: 55px;
  padding: 0 16px;

  background: #080e0a;
  border: 1px solid #29382e;
  border-radius: 12px;

  outline: none;
  color: white;
  font-size: 15px;

  transition: .25s;
}

.input:focus {
  border-color: var(--green);
  box-shadow: 0 0 0 3px rgba(0,255,117,.09);
}

.input::placeholder {
  color: #87938a;
}

.password-input {
  padding-right: 80px;
}

.toggle-password {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);

  border: none;
  background: transparent;
  color: var(--green);

  font-size: 12px;
  font-weight: 800;
  cursor: pointer;

  min-width: 44px;
  min-height: 44px;
}

/* Options */

.options {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin: 7px 0 25px;
}

.remember {
  display: flex;
  align-items: center;
  gap: 8px;
  color: #a9b5ac;
  font-size: 13px;
  margin: 0;
}

.remember input {
  accent-color: var(--green);
  width: 16px;
  height: 16px;
}

.forgot {
  color: var(--green);
  font-size: 13px;
  text-decoration: none;
}

/* Button */

.sign-in-btn {
  width: 100%;
  min-height: 55px;

  border: none;
  border-radius: 12px;

  background: linear-gradient(110deg, #00ff75, #00d963);
  color: #001b0c;

  font-size: 16px;
  font-weight: 900;

  cursor: pointer;
  transition: .25s;
}

.sign-in-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 0 28px rgba(0,255,117,.25);
}

.sign-in-btn:disabled {
  opacity: .6;
  cursor: wait;
  transform: none;
}

/* Messages */

.message {
  display: none;
  margin-top: 17px;
  padding: 13px;
  border-radius: 10px;

  font-size: 13px;
  line-height: 1.5;
  text-align: center;
}

.message.error {
  display: block;
  color: #ff8585;
  background: rgba(255,0,0,.08);
  border: 1px solid rgba(255,0,0,.2);
}

.message.success {
  display: block;
  color: var(--green);
  background: rgba(0,255,117,.07);
  border: 1px solid rgba(0,255,117,.2);
}

/* Divider */

.divider {
  display: flex;
  align-items: center;
  gap: 13px;

  color: #87938a;
  font-size: 12px;
  margin: 27px 0;
}

.divider::before,
.divider::after {
  content: "";
  flex: 1;
  height: 1px;
  background: #29352d;
}

/* Register */

.create-account {
  text-align: center;
  font-size: 14px;
  color: #a9b5ac;
}

.create-account a {
  color: var(--green);
  text-decoration: none;
  font-weight: 800;
}

.security-note {
  text-align: center;
  color: #87938a;
  font-size: 11px;
  line-height: 1.6;
  margin-top: 26px;
}

/* Mobile */

@media(max-width:480px) {

  body {
    padding: 15px;
  }

  .login-card {
    padding: 32px 21px;
  }

  h1 {
    font-size: 25px;
  }

  .logo {
    font-size: 29px;
  }
}

@media(prefers-reduced-motion:reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}

</style>
</head>

<body>

<div class="orb one"></div>
<div class="orb two"></div>

<div class="login-card">

  <div class="logo">FRAU<span>DEXA</span></div>

  <div class="icon">🛡️</div>

  <h1>Welcome Back.</h1>

  <p class="subtitle">
    Sign in to protect yourself from online fraud.
    Your digital safety starts here.
  </p>

  <form id="loginForm">

    <div class="form-group">

      <label for="email">Email Address</label>

      <input
        class="input"
        id="email"
        type="email"
        placeholder="Enter your email"
        autocomplete="email"
        required
      >

    </div>

    <div class="form-group">

      <label for="password">Password</label>

      <div class="input-wrap">

        <input
          class="input password-input"
          id="password"
          type="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >

        <button
          type="button"
          class="toggle-password"
          id="togglePassword"
        >
          SHOW
        </button>

      </div>

    </div>

    <div class="options">

      <label class="remember">
        <input type="checkbox" id="rememberMe">
        Remember me
      </label>

      <a href="#" class="forgot" id="forgotPassword">
        Forgot Password?
      </a>

    </div>

    <button
      type="submit"
      class="sign-in-btn"
      id="signInBtn"
    >
      Secure Sign In →
    </button>

    <div
      id="message"
      class="message"
      role="status"
      aria-live="polite"
    ></div>

  </form>

  <div class="divider">OR</div>

  <div class="create-account">

    Don't have an account?

    <a href="register.html">
      Create Account
    </a>

  </div>

  <div class="security-note">
    🔒 Secure authentication powered by Firebase.
    <br>
    Fraudexa — Know Before You Trust.
  </div>

</div>


<!-- FIREBASE AUTHENTICATION -->

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  setPersistence,
  browserLocalPersistence,
  browserSessionPersistence,
  onAuthStateChanged,
  sendPasswordResetEmail
}
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";


/* OLD FIREBASE CONFIG - UNCHANGED */

const firebaseConfig = {

  apiKey: "AIzaSyBNSTDIceQCupazPl4ZbzR4OFN64RVQgTY",

  authDomain: "fraudexa-15d6a.firebaseapp.com",

  projectId: "fraudexa-15d6a",

  storageBucket: "fraudexa-15d6a.firebasestorage.app",

  messagingSenderId: "891490763035",

  appId: "1:891490763035:web:15c654ed5946910ecc93be",

  measurementId: "G-X3K8MDGV7W"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);


/* ELEMENTS */

const form = document.getElementById("loginForm");

const emailInput = document.getElementById("email");

const passwordInput = document.getElementById("password");

const rememberMe = document.getElementById("rememberMe");

const signInBtn = document.getElementById("signInBtn");

const messageBox = document.getElementById("message");


/* PLAN REDIRECT SUPPORT */

function getReturnDestination() {

  const params = new URLSearchParams(window.location.search);

  const selectedPlan = params.get("plan");

  // Pro Plan ₹99

  if (selectedPlan === "pro") {

    sessionStorage.setItem(
      "fraudexa_pending_destination",
      "index.html?checkout=pro"
    );

  }

  // Business Plan ₹149

  if (selectedPlan === "business") {

    sessionStorage.setItem(
      "fraudexa_pending_destination",
      "index.html?checkout=business"
    );

  }

  const requested = params.get("next");

  const saved = sessionStorage.getItem(
    "fraudexa_pending_destination"
  );

  const destination = requested || saved || "index.html";

  // Security: Only same-origin destinations allowed

  try {

    const url = new URL(
      destination,
      window.location.href
    );

    if (url.origin !== window.location.origin) {
      return "index.html";
    }

    return url.pathname + url.search + url.hash;

  } catch {

    return "index.html";

  }

}


/* MESSAGE FUNCTION */

function showMessage(text, type) {

  messageBox.textContent = text;

  messageBox.className = "message " + type;

}

function clearMessage() {

  messageBox.textContent = "";

  messageBox.className = "message";

}


/* PASSWORD SHOW / HIDE */

document
.getElementById("togglePassword")
.addEventListener("click", () => {

  const visible = passwordInput.type === "text";

  passwordInput.type = visible ? "password" : "text";

  document.getElementById("togglePassword").textContent =
    visible ? "SHOW" : "HIDE";

});


/* ALREADY LOGGED-IN USER */

onAuthStateChanged(auth, (user) => {

  if (user) {

    const destination = getReturnDestination();

    window.location.replace(destination);

  }

});


/* LOGIN FUNCTION */

form.addEventListener("submit", async (e) => {

  e.preventDefault();

  clearMessage();

  const email = emailInput.value.trim();

  const password = passwordInput.value;

  if (!email || !password) {

    showMessage(
      "Please enter your email and password.",
      "error"
    );

    return;

  }

  signInBtn.disabled = true;

  signInBtn.textContent = "Signing in...";

  try {

    // Remember Me persistence

    const persistence = rememberMe.checked
      ? browserLocalPersistence
      : browserSessionPersistence;

    await setPersistence(auth, persistence);

    // Firebase Login

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    showMessage(
      "Login successful! Redirecting...",
      "success"
    );

    const destination = getReturnDestination();

    sessionStorage.removeItem(
      "fraudexa_pending_destination"
    );

    setTimeout(() => {

      window.location.replace(destination);

    }, 500);


  } catch (error) {

    console.error("Login error:", error);

    let errorMessage =
      "Unable to sign in. Please try again.";

    if (
      error.code === "auth/invalid-credential" ||
      error.code === "auth/wrong-password"
    ) {

      errorMessage = "Invalid email or password.";

    }

    else if (error.code === "auth/user-not-found") {

      errorMessage = "No account found with this email.";

    }

    else if (error.code === "auth/invalid-email") {

      errorMessage = "Please enter a valid email address.";

    }

    else if (error.code === "auth/too-many-requests") {

      errorMessage =
        "Too many attempts. Please try again later.";

    }

    else if (error.code === "auth/network-request-failed") {

      errorMessage =
        "Network error. Please check your internet.";

    }

    showMessage(errorMessage, "error");

  }

  finally {

    signInBtn.disabled = false;

    signInBtn.textContent = "Secure Sign In →";

  }

});


/* FORGOT PASSWORD */

document
.getElementById("forgotPassword")
.addEventListener("click", async (e) => {

  e.preventDefault();

  const email = emailInput.value.trim();

  if (!email) {

    showMessage(
      "Enter your email address first.",
      "error"
    );

    emailInput.focus();

    return;

  }

  try {

    await sendPasswordResetEmail(auth, email);

    showMessage(
      "Password reset link sent. Please check your email.",
      "success"
    );

  }

  catch (error) {

    console.error("Password reset error:", error);

    showMessage(
      "Unable to send reset email. Please check your email address.",
      "error"
    );

  }

});

</script>

</body>
</html>
