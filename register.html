<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fraudexa - Create Account</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #102010 0%, #080808 45%, #000000 100%);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 15px;
    }

    .container {
      width: 100%;
      max-width: 560px;
    }

    .card {
      width: 100%;
      padding: 45px 40px;
      border-radius: 22px;
      background: rgba(20, 25, 25, 0.88);
      border: 1px solid rgba(0, 255, 55, 0.18);
      box-shadow:
        0 0 35px rgba(0, 255, 55, 0.08),
        inset 0 0 30px rgba(0, 255, 55, 0.02);
      backdrop-filter: blur(10px);
    }

    .brand {
      text-align: center;
      font-size: 42px;
      font-weight: 900;
      color: #18ff00;
      letter-spacing: 1px;
      margin-bottom: 25px;
      text-shadow: 0 0 18px rgba(24, 255, 0, 0.25);
    }

    h1 {
      text-align: center;
      font-size: 42px;
      color: #ffd0bd;
      margin-bottom: 15px;
    }

    .subtitle {
      text-align: center;
      color: #ddd;
      font-size: 17px;
      line-height: 1.6;
      margin-bottom: 35px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 9px;
    }

    input {
      width: 100%;
      height: 58px;
      padding: 0 18px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.18);
      outline: none;
      background: rgba(45, 55, 55, 0.65);
      color: #ffffff;
      font-size: 16px;
      transition: 0.2s;
    }

    input::placeholder {
      color: #aaa;
    }

    input:focus {
      border-color: #18ff00;
      box-shadow: 0 0 12px rgba(24, 255, 0, 0.18);
    }

    .password-box {
      position: relative;
    }

    .password-box input {
      padding-right: 80px;
    }

    .show-btn {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: #18ff00;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
    }

    .create-btn {
      width: 100%;
      height: 60px;
      margin-top: 10px;
      border: none;
      border-radius: 14px;
      background: #18ff00;
      color: #061006;
      font-size: 19px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.2s;
    }

    .create-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 25px rgba(24,255,0,0.35);
    }

    .create-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 10px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    .message.error {
      display: block;
      background: rgba(255, 70, 70, 0.15);
      border: 1px solid rgba(255, 90, 90, 0.35);
      color: #ff9c9c;
    }

    .message.success {
      display: block;
      background: rgba(24, 255, 0, 0.10);
      border: 1px solid rgba(24, 255, 0, 0.30);
      color: #65ff55;
    }

    .signin {
      text-align: center;
      margin-top: 28px;
      color: #eeeeee;
      font-size: 16px;
    }

    .signin a {
      color: #18ff00;
      text-decoration: none;
      font-weight: 700;
    }

    .signin a:hover {
      text-decoration: underline;
    }

    .security-note {
      text-align: center;
      margin-top: 25px;
      color: #888;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .card {
        padding: 35px 22px;
      }

      .brand {
        font-size: 34px;
      }

      h1 {
        font-size: 32px;
      }

      .subtitle {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="card">

      <div class="brand">FRAUDEXA</div>

      <h1>Create Account.</h1>

      <p class="subtitle">
        Join FRAUDEXA and protect yourself from online scams.
      </p>

      <form id="registerForm">

        <div class="form-group">
          <label for="name">Full Name</label>
          <input
            type="text"
            id="name"
            placeholder="Enter your full name"
            autocomplete="name"
            required
          >
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="mobile">Mobile Number</label>
          <input
            type="tel"
            id="mobile"
            placeholder="Enter your mobile number"
            maxlength="10"
            autocomplete="tel"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>

          <div class="password-box">
            <input
              type="password"
              id="password"
              placeholder="Create a password"
              minlength="6"
              autocomplete="new-password"
              required
            >

            <button
              type="button"
              class="show-btn"
              id="showPassword"
            >
              SHOW
            </button>
          </div>
        </div>

        <button
          type="submit"
          class="create-btn"
          id="createAccountBtn"
        >
          Create Account
        </button>

        <div id="message" class="message"></div>

      </form>

      <div class="signin">
        Already have an account?
        <a href="login.html">Sign In</a>
      </div>

      <div class="security-note">
        Your authentication is handled securely by Firebase Authentication.
      </div>

    </div>
  </div>


  <!-- Firebase -->
  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      updateProfile
    }
      from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";


    // ==========================================
    // FRAUDEXA FIREBASE CONFIG
    // ==========================================

    const firebaseConfig = {
      apiKey: "AIzaSyBNSTDIceQCupazPl4ZbzR4OFN64RVQgTY",
      authDomain: "fraudexa-15d6a.firebaseapp.com",
      projectId: "fraudexa-15d6a",
      storageBucket: "fraudexa-15d6a.firebasestorage.app",
      messagingSenderId: "891490763035",
      appId: "1:891490763035:web:15c654ed5946910ecc93be",
      measurementId: "G-X3K8MDGV7W"
    };


    // Initialize Firebase
    const app = initializeApp(firebaseConfig);

    // Firebase Authentication
    const auth = getAuth(app);


    // ==========================================
    // ELEMENTS
    // ==========================================

    const registerForm =
      document.getElementById("registerForm");

    const nameInput =
      document.getElementById("name");

    const emailInput =
      document.getElementById("email");

    const mobileInput =
      document.getElementById("mobile");

    const passwordInput =
      document.getElementById("password");

    const createAccountBtn =
      document.getElementById("createAccountBtn");

    const message =
      document.getElementById("message");

    const showPassword =
      document.getElementById("showPassword");


    // ==========================================
    // SHOW / HIDE PASSWORD
    // ==========================================

    showPassword.addEventListener("click", () => {

      if (passwordInput.type === "password") {

        passwordInput.type = "text";
        showPassword.textContent = "HIDE";

      } else {

        passwordInput.type = "password";
        showPassword.textContent = "SHOW";

      }

    });


    // ==========================================
    // MOBILE VALIDATION
    // ==========================================

    mobileInput.addEventListener("input", () => {

      mobileInput.value =
        mobileInput.value.replace(/\D/g, "").slice(0, 10);

    });


    // ==========================================
    // MESSAGE
    // ==========================================

    function showMessage(text, type) {

      message.textContent = text;

      message.className =
        "message " + type;

    }


    // ==========================================
    // FIREBASE ERROR HANDLER
    // ==========================================

    function getFirebaseError(errorCode) {

      switch (errorCode) {

        case "auth/email-already-in-use":
          return "This email is already registered. Please Sign In.";

        case "auth/invalid-email":
          return "Please enter a valid email address.";

        case "auth/weak-password":
          return "Password is too weak. Use at least 6 characters.";

        case "auth/network-request-failed":
          return "Network error. Please check your internet connection.";

        case "auth/operation-not-allowed":
          return "Email/Password authentication is not enabled in Firebase.";

        case "auth/api-key-not-valid":
        case "auth/api-key-not-valid.-please-pass-a-valid-api-key.":
          return "Firebase API configuration is invalid.";

        default:
          return "Unable to create account. Please try again.";

      }

    }


    // ==========================================
    // CREATE ACCOUNT
    // ==========================================

    registerForm.addEventListener("submit", async (event) => {

      event.preventDefault();


      const name =
        nameInput.value.trim();

      const email =
        emailInput.value.trim();

      const mobile =
        mobileInput.value.trim();

      const password =
        passwordInput.value;


      // Basic validation
      if (!name) {

        showMessage(
          "Please enter your full name.",
          "error"
        );

        return;
      }


      if (!email) {

        showMessage(
          "Please enter your email address.",
          "error"
        );

        return;
      }


      if (mobile.length !== 10) {

        showMessage(
          "Please enter a valid 10-digit mobile number.",
          "error"
        );

        return;
      }


      if (password.length < 6) {

        showMessage(
          "Password must contain at least 6 characters.",
          "error"
        );

        return;
      }


      // Disable button
      createAccountBtn.disabled = true;

      createAccountBtn.textContent =
        "Creating Account...";

      message.className = "message";


      try {

        // Create real Firebase user
        const userCredential =
          await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );


        const user =
          userCredential.user;


        // Save user's name in Firebase Auth profile
        await updateProfile(user, {
          displayName: name
        });


        showMessage(
          "Account created successfully! Redirecting...",
          "success"
        );


        // Small delay so user sees success
        setTimeout(() => {

          window.location.href = "index.html";

        }, 1000);


      } catch (error) {

        console.error(
          "Firebase registration error:",
          error
        );


        showMessage(
          "Firebase: " +
          getFirebaseError(error.code),
          "error"
        );


        createAccountBtn.disabled = false;

        createAccountBtn.textContent =
          "Create Account";

      }

    });

  </script>

</body>
</html>
