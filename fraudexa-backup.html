<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FRAUDEXA — Know Before You Trust</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #06100e;
            color: #ffffff;
        }

        header {
            padding: 24px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            color: #18d89b;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            margin-left: 25px;
        }

        .hero {
            min-height: 90vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
        }

        .hero-content {
            width: 100%;
            max-width: 850px;
        }

        .badge {
            display: inline-block;
            color: #18d89b;
            background: rgba(24, 216, 155, 0.08);
            border: 1px solid rgba(24, 216, 155, 0.25);
            padding: 10px 18px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 28px;
        }

        h1 {
            font-size: clamp(48px, 8vw, 86px);
            line-height: 1;
            margin-bottom: 28px;
        }

        h1 span {
            color: #18d89b;
        }

        .subtitle {
            max-width: 680px;
            margin: 0 auto 40px;
            font-size: 19px;
            line-height: 1.6;
            color: #aab8b4;
        }

        .checker {
            max-width: 760px;
            margin: auto;
            padding: 8px;
            display: flex;
            gap: 8px;
            background: #0d1c19;
            border: 1px solid #29463f;
            border-radius: 18px;
        }

        .checker input {
            flex: 1;
            min-width: 0;
            padding: 19px;
            border: none;
            outline: none;
            background: transparent;
            color: white;
            font-size: 16px;
        }

        .checker button {
            border: none;
            border-radius: 13px;
            padding: 0 28px;
            background: #18d89b;
            color: #03100c;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
        }

        .checker button:hover {
            opacity: 0.9;
        }

        #result {
            display: none;
            max-width: 760px;
            margin: 22px auto 0;
            padding: 22px;
            border-radius: 16px;
            background: #0d1c19;
            border: 1px solid #29463f;
            text-align: left;
            line-height: 1.6;
        }

        .risk-high {
            color: #ff6b6b;
        }

        .risk-suspicious {
            color: #ffc857;
        }

        .risk-low {
            color: #18d89b;
        }

        @media (max-width: 650px) {

            header {
                padding: 20px;
            }

            nav {
                display: none;
            }

            .checker {
                flex-direction: column;
            }

            .checker input {
                width: 100%;
            }

            .checker button {
                min-height: 55px;
            }

            h1 {
                font-size: 50px;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        FRAUDEXA
    </div>

    <nav>
        <a href="#">Home</a>
        <a href="#">How It Works</a>
        <a href="#">Alerts</a>
    </nav>

</header>


<section class="hero">

    <div class="hero-content">

        <div class="badge">
            🛡️ PROTECT YOURSELF FROM ONLINE SCAMS
        </div>

        <h1>
            Know Before<br>
            You <span>Trust.</span>
        </h1>

        <p class="subtitle">
            Check suspicious messages, links and online offers
            before you click, pay or share your information.
        </p>


        <div class="checker">

            <

        </div>


        <div id="result"></div>

    </div>

</section>


<script>

const input = document.getElementById("checkInput");
const button = document.getElementById("checkButton");
const result = document.getElementById("result");


button.addEventListener("click", function () {

    const message = input.value.toLowerCase().trim();

    if (message === "") {

        result.style.display = "block";
        result.className = "risk-suspicious";

        result.innerHTML =
            "⚠️ <strong>Please enter a message or link.</strong>";

        return;
    }


    const warningWords = [
        "won",
        "winner",
        "prize",
        "lottery",
        "processing fee",
        "urgent",
        "otp",
        "password",
        "bank account",
        "send money",
        "claim your prize",
        "verify your account",
        "click this link",
        "pay now",
        "gift card"
    ];


    const detected = [];


    for (const word of warningWords) {

        if (message.includes(word)) {
            detected.push(word);
        }

    }


    result.style.display = "block";


    if (detected.length >= 2) {

        result.className = "risk-high";

        result.innerHTML = `
            🚨 <strong>HIGH RISK</strong>
            <br><br>
            Multiple suspicious signals were detected.
            <br><br>
            <strong>Warning signals:</strong>
            ${detected.join(", ")}
            <br><br>
            ⚠️ Do not send money, OTPs, passwords or personal information.
        `;

    }

    else if (detected.length === 1) {

        result.className = "risk-suspicious";

        result.innerHTML = `
            ⚠️ <strong>SUSPICIOUS</strong>
            <br><br>
            We detected a potential warning signal:
            <br><br>
            <strong>${detected[0]}</strong>
            <br><br>
            Verify the sender before taking any action.
        `;

    }

    else {

        result.className = "risk-low";

        result.innerHTML = `
            🟢 <strong>NO OBVIOUS RED FLAGS FOUND</strong>
            <br><br>
            We did not detect common scam signals.
            <br><br>
            This does <strong>not</strong> guarantee that the message is safe.
        `;

    }

});

</script>

</body>
</html>
<div class="checker">

    <button id="checkButton">
        Check Now
    </button>

</div>

<div id="result"></div>
